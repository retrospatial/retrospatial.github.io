title: Blogroll

desc: This is a non-exhaustive list of people and sites I follow, mostly via my RSS feed. I look to them for inspiration, tips, ideas, and—in this age of content farms and algorithmic drivel—the sheer literary pleasure of reading human writing. I am also generally just nosy and love reading what friends and strangers are up to.

