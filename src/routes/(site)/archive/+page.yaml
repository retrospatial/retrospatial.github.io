  - title: Original portfolio
    date: 2023-11
    desc: >
      I built this by reskinning <a href="https://patdryburgh.github.io/hitchens/">this Jekyll theme</a>. In retrospect, I have no idea why I did that — I'd never written Ruby or Liquid before and distinctly remember having a miserable time trying to wrap my head around the architecture of the template. It was such an overengineered approach for what could've easily been two `html` files and one `css` file. I probably saw a tutorial for deploying a Jekyll site on Github Pages and thought I'd at least learn something new by being elbows deep in it.


      I considered using a website builder like Squarespace or Wix but ultimately did not want to take the easy route; I wanted to come out of my winter break having built a portfolio site 'by hand', even if it didn't look polished. And like, it was definitely crude, the colors clashed, and there was NO responsiveness to speak of because this was before I learned how to style for mobile, so it looked like a hot mess on anything smaller than tablet size


      I love the colorful, isometric look of the <a href="https://nabla.typearture.com/">Nabla font</a> for the headings and have tried to reuse it in other projects, but unfortunately it still isn't supported by Safari or iOS, so the color fill won't render.
    imgs:
      - site1_1.webp
      - site1_2.webp
      - site1_3.webp
